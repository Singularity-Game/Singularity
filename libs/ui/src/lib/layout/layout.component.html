@if (colors$ | async; as colors) {
  <div
    [style.--primary]="colors[0]"
    [style.--secondary]="colors[1]"
    >
    <ng-content></ng-content>
    @for (toast of toasts$ | async; track toast; let i = $index) {
      <sui-toast [title]="toast.header" [message]="toast.message" [type]="toast.type" [i]="i"></sui-toast>
    }
  </div>
}
<div id="modal-outlet"></div>
