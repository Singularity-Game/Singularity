<sui-input-container>
  <div class="sui-files">
    @for (file of files; track file.name) {
      @if (loading) {
        <sui-loader></sui-loader>
      }
      @if (success && !loading) {
        <img src="assets/icons/check.svg" alt="success" />
      }
      @if (!success && !loading) {
        <img src="assets/icons/x.svg" alt="failure" />
      }
      {{file.name}}
    }

    <button suiButton size="xs" [isIcon]="true" (click)="removed.emit()">
      @if (!loading) {
        <img src="assets/icons/x.svg" alt="failure" />
      }
    </button>
  </div>
</sui-input-container>
