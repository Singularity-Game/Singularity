<div class="toast"
  [class.error]="type === 'error'"
  [class.success]="type === 'success'"
  [class.warning]="type === 'warning'"
  [class.info]="type === 'info'"
  [style.top]="i * (64 + 10) + 25 + 'px'">

  @if (type === 'error') {
    <img class="icon" src="assets/icons/x.svg" alt="error icon" />
  }
  @if (type === 'success') {
    <img class="icon" src="assets/icons/check.svg" alt="check icon" />
  }
  @if (type === 'warning') {
    <img class="icon" src="assets/icons/warning.svg" alt="warning icon" />
  }
  @if (type === 'info') {
    <img class="icon" src="assets/icons/info.svg" alt="info icon" />
  }
  <div>
    <h4 class="toast-text">{{ title }}</h4>
    <p class="toast-text">{{ message }}</p>
  </div>
</div>
