<p class="lyrics-main">
  @for (note of currentLine; track note) {
    <span>
      <span
        [class.lyrics-highlighted]="note === currentNote"
        [style.animation-duration]="(note.lengthInBeats * (60 / (bpm ?? 1))) + 's'"
      >{{ note.text }}</span>
    </span>
  }
</p>
<p class="lyrics-secondary">
  @for (note of nextLine; track note) {
    <span
    >{{ note.text }}</span>
  }
</p>
