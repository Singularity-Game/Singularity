<div class="center text-center">
  <p class="text-center">{{ 'party.smartphone.joinParty.selfie' | transloco }}</p>
  <video class="video" [class.invisible]="photoTaken" #video></video>
  <canvas class="video" [class.invisible]="!photoTaken" #canvas></canvas>
  <div class="text-center sui-space-top-large">
    @if (!photoTaken) {
      <button suiButton (click)="takePicture()">{{ 'party.smartphone.joinParty.triggerSelfie' | transloco }}</button>
    }
    @if (photoTaken) {
      <button suiButton (click)="continue()">{{ 'party.smartphone.joinParty.nextButton' | transloco }}</button>
    }
  </div>
  <div class="text-center sui-space-top-large">
    @if (!photoTaken) {
      <button suiButton (click)="skip()">{{ 'party.smartphone.joinParty.skip' | transloco }}</button>
    }
    @if (photoTaken) {
      <button suiButton (click)="retakePicture()">{{ 'party.smartphone.joinParty.retry' | transloco }}</button>
    }
  </div>
</div>
